<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Bishvat: The Seven Species Mission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+Hebrew:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .hebrew { font-family: 'Noto Sans Hebrew', sans-serif; }

        .perspective-2000 { perspective: 2000px; }
        .inner-card {
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .is-flipped { transform: rotateY(180deg); }
        .card-face {
            backface-visibility: hidden;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 2.5rem;
        }
        .card-back { transform: rotateY(180deg); }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0); opacity: 0; }
            20% { opacity: 1; scale: 1.2; }
            100% { transform: translateY(110vh) rotate(360deg) scale(0.8); opacity: 0; }
        }
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            animation: confetti-fall 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .thermometer-fill {
            transition: height 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .source-tag {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .species-badge {
            transition: all 0.4s ease;
            filter: grayscale(1) opacity(0.2);
        }
        .species-badge.completed {
            filter: grayscale(0) opacity(1);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div id="app" class="h-screen flex flex-col relative overflow-hidden">
        <div id="particle-overlay"></div>

        <!-- Header -->
        <header class="h-20 bg-slate-900 border-b border-white/10 flex items-center justify-between px-10 shrink-0 z-50">
            <div class="flex items-center gap-4">
                <div class="p-2 bg-emerald-500/20 rounded-lg border border-emerald-500/30">
                    <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13m9-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13" stroke-width="2"/></svg>
                </div>
                <h1 class="text-xl font-black uppercase tracking-tighter">Tu Bishvat: The Seven Species Mission</h1>
            </div>
            
            <div id="timer-ui" class="hidden px-6 py-2 bg-slate-800 rounded-full border border-white/10 flex items-center gap-3">
                <span class="text-emerald-400 font-black text-xl tabular-nums" id="timer-val">60s</span>
            </div>

            <div class="flex gap-4">
                <button onclick="toggleSettings()" class="p-3 bg-slate-800 rounded-xl border border-white/10">⚙️</button>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="flex-grow flex p-6 gap-6 overflow-hidden">
            
            <!-- Navigation -->
            <div id="species-nav" class="w-72 flex flex-col gap-2 shrink-0 overflow-y-auto pr-2"></div>

            <!-- Gameplay -->
            <div class="flex-grow flex flex-col items-center justify-center relative bg-slate-900/40 rounded-[3rem] border border-white/5 shadow-inner p-8">
                
                <div id="player-tag" class="hidden mb-6 px-8 py-3 bg-slate-800/80 backdrop-blur border border-white/10 rounded-full flex flex-col items-center">
                    <span class="text-[9px] font-black text-emerald-400 tracking-widest uppercase">Current Task Force</span>
                    <div id="active-players" class="text-2xl font-black uppercase">--</div>
                </div>

                <div id="game-portal" class="w-full max-w-md aspect-[3/4] relative">
                    <div id="main-card-ui" class="w-full h-full perspective-2000">
                        <div id="inner-card" class="inner-card">
                            <!-- Front -->
                            <div id="card-front" class="card-face border-8 shadow-2xl p-8">
                                <div id="front-icon" class="mb-6 p-10 bg-white/10 rounded-full border border-white/20"></div>
                                <div class="text-center">
                                    <h2 id="front-title" class="text-4xl font-black uppercase mb-1">WHEAT</h2>
                                    <div id="front-hebrew" class="hebrew text-2xl font-black opacity-50 mb-8">חִטָּה</div>
                                </div>
                                <button onclick="handleInitiate()" id="initiate-btn" class="w-full py-5 bg-white text-slate-950 rounded-2xl font-black text-xl uppercase tracking-widest hover:scale-105 transition-transform shadow-xl">
                                    Initiate
                                </button>
                            </div>
                            <!-- Back -->
                            <div id="card-back" class="card-face card-back bg-white text-slate-900 p-10 shadow-2xl">
                                <div id="back-content" class="flex-grow flex flex-col items-center justify-center text-center w-full overflow-y-auto"></div>
                                <div class="w-full space-y-3 shrink-0">
                                    <button id="reveal-btn" onclick="handleReveal()" class="hidden w-full py-5 bg-slate-900 text-white rounded-2xl font-black text-xl uppercase">Reveal Answer</button>
                                    <button id="complete-btn" onclick="handleComplete()" class="hidden w-full py-5 bg-emerald-500 text-white rounded-2xl font-black text-xl uppercase">Confirm Repair</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="match-game-area" class="hidden absolute inset-0 z-30">
                        <div id="match-grid" class="grid grid-cols-4 gap-3 w-full h-full"></div>
                    </div>
                </div>
            </div>

            <!-- Thick Thermometer with Species Badges -->
            <aside class="w-48 flex flex-col items-center py-6 bg-slate-900/40 rounded-[3rem] border border-white/5 shrink-0">
                <div id="global-percent" class="text-3xl font-black text-emerald-400 mb-4">0%</div>
                
                <!-- Meter -->
                <div class="flex-grow w-14 bg-slate-800 rounded-full flex flex-col-reverse overflow-hidden border-4 border-slate-700 shadow-inner relative mb-6">
                    <div id="progress-fill" class="thermometer-fill w-full bg-gradient-to-t from-emerald-600 via-emerald-400 to-emerald-300" style="height: 0%"></div>
                </div>

                <!-- Species Badges Stack -->
                <div id="species-badges" class="grid grid-cols-2 gap-2 px-4 mb-2"></div>
                
                <div class="text-[9px] font-black text-slate-500 uppercase text-center tracking-tighter">Repair Status</div>
            </aside>
        </main>

        <!-- Settings -->
        <div id="settings-modal" class="hidden fixed inset-0 z-[100] bg-slate-950/95 backdrop-blur-xl flex items-center justify-center p-6">
            <div class="bg-slate-900 border border-white/10 rounded-[2.5rem] w-full max-w-2xl p-10">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-black uppercase">Mission Config</h2>
                    <button onclick="toggleSettings()" class="text-3xl">✕</button>
                </div>
                <div class="grid grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div>
                            <label class="text-[10px] font-black text-slate-500 uppercase mb-2 block">Group Size (1-4)</label>
                            <input type="number" id="cfg-group-size" value="2" min="1" max="4" class="w-full bg-slate-800 p-3 rounded-lg border border-white/10 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-500 uppercase mb-2 block">Target Missions / Species</label>
                            <input type="number" id="cfg-target-missions" value="5" min="1" max="10" class="w-full bg-slate-800 p-3 rounded-lg border border-white/10 outline-none">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-500 uppercase mb-2 block">Mission Timer</label>
                            <select id="cfg-timer" class="w-full bg-slate-800 p-3 rounded-lg border border-white/10 outline-none">
                                <option value="0">Off</option>
                                <option value="30">30 Seconds</option>
                                <option value="60" selected>60 Seconds</option>
                                <option value="120">120 Seconds</option>
                            </select>
                        </div>
                    </div>
                    <div class="space-y-6 flex flex-col">
                        <div class="flex-grow">
                            <label class="text-[10px] font-black text-slate-500 uppercase mb-2 block">Roster</label>
                            <div id="roster-list" class="h-32 overflow-y-auto bg-slate-950/50 p-3 rounded-lg border border-white/5 space-y-1 mb-2"></div>
                            <div class="flex gap-2">
                                <input type="text" id="add-student-name" placeholder="Name..." class="flex-grow bg-slate-800 p-2 rounded-lg text-sm outline-none">
                                <button onclick="addStudent()" class="bg-emerald-500 px-4 rounded-lg font-bold">Add</button>
                            </div>
                        </div>
                        <button onclick="resetGame()" class="w-full py-4 bg-red-500/10 text-red-500 border border-red-500/30 font-black uppercase rounded-xl hover:bg-red-500/20">Reset Mission</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Celebration Overlay -->
        <div id="game-over-overlay" class="hidden fixed inset-0 z-[200] bg-emerald-600/95 backdrop-blur-2xl flex flex-col items-center justify-center p-10 text-center cursor-pointer" onclick="closeCelebration()">
            <div class="w-32 h-32 mb-10 text-white">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V12M12 12L8 8M12 12L16 8M12 8V2M12 8L8 4M12 8L16 4"/></svg>
            </div>
            <h2 class="text-7xl font-black uppercase mb-4 tracking-tighter">Mission Accomplished</h2>
            <p class="text-2xl font-bold opacity-80 uppercase tracking-[0.3em]">The Seven Species Flourish</p>
        </div>
    </div>

    <script>
        // LOCKED CONTENT DATABASE
        const SPECIES_DATA = {
            wheat: { 
                en: "Wheat", hb: "חִטָּה", color: "#f59e0b", type: "Vocab",
                items: [
                    { h: "עֵץ", e: "Tree" }, { h: "אֲדָמָה", e: "Earth" }, { h: "זֶרַע", e: "Seed" },
                    { h: "מַיִם", e: "Water" }, { h: "שֶׁמֶשׁ", e: "Sun" }, { h: "קָצִיר", e: "Harvest" },
                    { h: "לֶחֶם", e: "Bread" }, { h: "שָׂדֶה", e: "Field" }, { h: "טֶבַע", e: "Nature" },
                    { h: "צֶמַח", e: "Plant" }
                ]
            },
            barley: { 
                en: "Barley", hb: "שְׂעוֹרָה", color: "#eab308", type: "Trivia",
                items: [
                    { q: "How many 'New Years' are in the Jewish calendar?", a: "Four" },
                    { q: "Which tree is the first to bloom in Israel in Shevat?", a: "שָׁקֵד (shaqed) - Almond" },
                    { q: "What is the Hebrew date of Tu Bishvat?", a: "15th of שְׁבָט (Shevat)" },
                    { q: "In the metaphor 'A person is like a tree,' what do the roots represent?", a: "Our values, family, and Jewish traditions" },
                    { q: "Barley was one of the first crops grown in ancient Israel.", a: "True" },
                    { q: "What color are almond blossoms?", a: "White or light pink" },
                    { q: "What do we call the festive meal on Tu Bishvat?", a: "Seder" },
                    { q: "Which book of the Torah lists the Seven Species?", a: "Deuteronomy (Devarim)" },
                    { q: "What prayer is said over new fruit?", a: "Shehecheyanu" },
                    { q: "True or False: Barley ripens before wheat in Israel.", a: "True" }
                ]
            },
            grape: { 
                en: "Grapes", hb: "עֲנָבִים", color: "#6366f1", type: "Discussion",
                items: [
                    { s: "The Lorax", q: "Unless someone like you cares a whole awful lot, nothing is going to get better. It’s not.", p: "What local environment would you protect first?" },
                    { s: "Talmud", q: "As my ancestors planted for me, so I plant for my children.", p: "What are we planting for people 50 years from now?" },
                    { s: "Gandhi", q: "Earth provides enough to satisfy every man's needs, but not every man's greed.", p: "How can we practice enough-ness this week?" },
                    { s: "Proverb", q: "The best time to plant a tree was 20 years ago. The second best time is now.", p: "What green habit can you start today?" },
                    { s: "Folklore", q: "A vine needs a trellis to grow high.", p: "Who are the supporters who help you grow?" },
                    { s: "Einstein", q: "Look deep into nature, and then you will understand everything better.", p: "What is the most complex thing you have seen in nature?" },
                    { s: "Mary Davis", q: "To walk in nature is to witness a thousand miracles.", p: "What tiny miracle have you noticed recently?" },
                    { s: "Proverb", q: "The vine produces clusters, not single grapes.", p: "How is our class like a cluster of grapes?" },
                    { s: "Torah", q: "When you besiege a city… you must not destroy its trees.", p: "Why is wasting resources a problem?" },
                    { s: "Midrash", q: "Every blade of grass has an angel that whispers to it, ‘Grow.’", p: "What helps you grow when things are hard?" }
                ]
            },
            fig: { 
                en: "Figs", hb: "תְּאֵנִים", color: "#9333ea", type: "Charades",
                items: [
                    "A seed slowly growing into a tree", "A squirrel hiding nuts", "Reaching high to pick ripe fruit from a tree",
                    "A bee pollinating a flower", "A gardener planting a tree", "Wind blowing through leaves",
                    "A bird building a nest", "People picnicking under a tree", "Cleaning trash from a park or forest", "Rain in a forest"
                ]
            },
            pomegranate: { 
                en: "Pomegranate", hb: "רִמּוֹן", color: "#dc2626", type: "Memory",
                items: [
                    { a: "ט״וּ בִּשְׁבָט Tu Bishvat", b: "Birthday of the Trees" },
                    { a: "Planting a tree", b: "Replaces Forests" },
                    { a: "Picking up trash", b: "Protects wildlife" },
                    { a: "Composting food scraps", b: "Feeds the soil" },
                    { a: "טֶבַע", b: "Nature" },
                    { a: "Bees", b: "Pollinate flowers" },
                    { a: "אֶרֶץ", b: "Land" },
                    { a: "מַיִם", b: "Water" }
                ]
            },
            olive: { 
                en: "Olives", hb: "זֵיתִים", color: "#65a30d", type: "Mindreader",
                items: [
                    { t: "Peace", h: "שָׁלוֹם", f: ["War", "Quiet", "Shalom", "Olive"] },
                    { t: "Light", h: "אוֹר", f: ["Sun", "Lamp", "Dark", "Olive"] },
                    { t: "Oil", h: "שֶׁמֶן", f: ["Fat", "Cooking", "Hanukkah", "Liquid"] },
                    { t: "Mountain", h: "הַר", f: ["Hill", "Climb", "High", "Peak"] },
                    { t: "Branch", h: "עָנָף", f: ["Tree", "Stick", "Leaf", "Bird"] },
                    { t: "Ancient", h: "עַתִּיק", f: ["Old", "History", "New", "Past"] },
                    { t: "Green", h: "יָרוֹק", f: ["Color", "Grass", "Leaf", "Nature"] },
                    { t: "Dove", h: "יוֹנָה", f: ["Bird", "Fly", "White", "Peace"] },
                    { t: "Strength", h: "כּוֹחַ", f: ["Strong", "Muscle", "Weak", "Power"] },
                    { t: "Friend", h: "חָבֵר", f: ["Buddy", "Person", "School", "Love"] }
                ]
            },
            date: { 
                en: "Dates", hb: "תְּמָרִים", color: "#c2410c", type: "Jeopardy",
                items: [
                    { q: "Repairing the world through justice and kindness", a: "תִּיקּוּן עוֹלָם (Tikkun Olam)" },
                    { q: "Blessing over fruit from a tree", a: "בּוֹרֵא פְּרִי הָעֵץ (Borei Pri Ha’etz)" },
                    { q: "Month when Tu Bishvat occurs", a: "שְׁבָט (Shevat)" },
                    { q: "Land of milk and honey (date honey)", a: "אֶרֶץ יִשְׂרָאֵל (Eretz Yisrael)" },
                    { q: "A young tree or plant", a: "שְׁתִיל (Sapling)" },
                    { q: "Crown of the Seven Species with 613 seeds", a: "רִמּוֹן (Pomegranate)" },
                    { q: "Part of a tree that absorbs water", a: "שֹׁרָשִׁים (Roots)" },
                    { q: "New Year for Trees", a: "ט\"ו בִּשְׁבָט (Tu Bishvat)" }
                ]
            }
        };

        // State Management
        let state = {
            roster: ["Abby", "Marshall", "Julianna", "Kai", "Ellie", "Adi", "Aaron", "Isaac", "Avery P.", "David"],
            rosterIdx: 0,
            active: 'wheat',
            inventory: { wheat:0, barley:0, grape:0, fig:0, pomegranate:0, olive:0, date:0 },
            indices: { wheat:0, barley:0, grape:0, fig:0, pomegranate:0, olive:0, date:0 },
            cfg: { groupSize: 2, target: 5, timer: 60 },
            pomegranate: { matched: [], flipped: [], deck: null },
            processing: false,
            timer: null
        };

        // --- Core Functions ---
        function init() {
            renderNav();
            renderRoster();
            updateThermometer();
            syncCard();
        }

        function renderNav() {
            const container = document.getElementById('species-nav');
            container.innerHTML = Object.keys(SPECIES_DATA).map(key => {
                const s = SPECIES_DATA[key];
                const done = state.inventory[key] >= state.cfg.target;
                const progress = (state.inventory[key] / state.cfg.target) * 100;
                const offset = 125.6 - (progress / 100) * 125.6;

                return `
                <button onclick="selectSpecies('${key}')" 
                    class="relative group flex items-center gap-4 p-4 rounded-3xl border transition-all 
                    ${state.active === key ? 'scale-[1.02] shadow-xl' : 'opacity-70'}
                    ${done ? 'bg-opacity-100' : 'bg-slate-900/50 border-white/5'}"
                    style="${done ? `background-color: ${s.color}; border-color: white;` : (state.active === key ? `background-color: white; color: #0f172a;` : '')}">
                    
                    <div class="relative w-12 h-12 flex items-center justify-center shrink-0">
                        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 50 50">
                            <circle class="progress-ring__circle" stroke="${done ? 'white' : s.color}" stroke-width="3" fill="transparent" r="20" cx="25" cy="25" 
                                style="stroke-dasharray: 125.6; stroke-dashoffset: ${offset}; opacity: ${done ? 0 : 1}"/>
                        </svg>
                        <div class="z-10 w-6 h-6">${getIcon(key, (done || state.active === key) ? (done ? 'white' : '#0f172a') : s.color)}</div>
                    </div>

                    <div class="text-left flex-grow">
                        <div class="text-[10px] font-black uppercase tracking-widest ${state.active === key ? 'text-slate-900' : 'opacity-60'} leading-none mb-1">${s.en}</div>
                        <div class="hebrew text-sm font-black">${s.hb}</div>
                    </div>
                </button>
                `;
            }).join('');
        }

        function syncCard() {
            const key = state.active;
            const s = SPECIES_DATA[key];
            const portal = document.getElementById('main-card-ui');
            const matchArea = document.getElementById('match-game-area');
            
            document.getElementById('inner-card').classList.remove('is-flipped');
            state.processing = false;

            if (key === 'pomegranate') {
                portal.classList.add('invisible');
                matchArea.classList.remove('hidden');
                renderMatchGrid();
            } else {
                portal.classList.remove('invisible');
                matchArea.classList.add('hidden');
                
                const front = document.getElementById('card-front');
                front.style.backgroundColor = s.color;
                front.style.borderColor = 'white';
                
                document.getElementById('front-icon').innerHTML = getIcon(key, 'white', 'w-32 h-32');
                document.getElementById('front-title').innerText = s.en;
                document.getElementById('front-hebrew').innerText = s.hb;
            }

            if (key === 'fig' || key === 'olive') {
                document.getElementById('player-tag').classList.remove('hidden');
                const p = [];
                for(let i=0; i<state.cfg.groupSize; i++) p.push(state.roster[(state.rosterIdx + i) % state.roster.length]);
                document.getElementById('active-players').innerText = p.join(" & ");
            } else {
                document.getElementById('player-tag').classList.add('hidden');
            }
        }

        function handleInitiate() {
            const s = SPECIES_DATA[state.active];
            const item = s.items[state.indices[state.active] % s.items.length];
            let html = "";

            if (state.active === 'wheat') {
                html = `<span class="hebrew text-8xl font-black mb-4">${item.h}</span><div class="text-slate-400 font-bold uppercase tracking-widest">Identify Translation</div>`;
                state.currentAnswer = item.e;
            } else if (state.active === 'barley') {
                html = `<h3 class="text-3xl font-black uppercase mb-8 leading-tight">${item.q}</h3>`;
                state.currentAnswer = item.a;
            } else if (state.active === 'grape') {
                html = `<p class="italic text-lg mb-4">"${item.q}"</p><span class="source-tag mb-12">— ${item.s}</span><h3 class="text-2xl font-black uppercase text-indigo-600">${item.p}</h3>`;
            } else if (state.active === 'fig') {
                html = `<div class="text-slate-400 font-black uppercase mb-8 tracking-[0.4em]">Act Out</div><h3 class="text-4xl font-black uppercase">${item}</h3>`;
            } else if (state.active === 'olive') {
                html = `<h3 class="text-6xl font-black hebrew text-lime-600 mb-6">${item.h}</h3><h4 class="text-3xl font-black uppercase mb-10">${item.t}</h4><div class="flex flex-wrap justify-center gap-2">` + 
                       item.f.map(w => `<span class="px-3 py-1 bg-red-50 text-red-500 rounded-full text-[10px] font-black uppercase border border-red-100">${w}</span>`).join('') + 
                       `</div>`;
            } else if (state.active === 'date') {
                html = `<div class="text-slate-400 font-black uppercase mb-8 tracking-[0.4em]">Jeopardy</div><h3 class="text-2xl font-bold italic mb-10">"I am ${item.q}..."</h3>`;
                state.currentAnswer = item.a;
            }

            renderContent(s.type, html);
            document.getElementById('inner-card').classList.add('is-flipped');
            
            const reveal = document.getElementById('reveal-btn');
            const complete = document.getElementById('complete-btn');

            if (state.currentAnswer) {
                reveal.classList.remove('hidden');
                complete.classList.add('hidden');
            } else {
                reveal.classList.add('hidden');
                complete.classList.remove('hidden');
            }

            if (state.cfg.timer > 0 && (s.type === 'Charades' || s.type === 'Mindreader')) startTimer();
        }

        function handleReveal() {
            const html = `
                <div class="text-emerald-500 mb-6"><svg class="w-20 h-20 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17L4 12"/></svg></div>
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Repair Key</div>
                <p class="text-4xl font-black text-slate-900 uppercase tracking-tighter">${state.currentAnswer}</p>
            `;
            renderContent("REVEALED", html);
            document.getElementById('reveal-btn').classList.add('hidden');
            document.getElementById('complete-btn').classList.remove('hidden');
            state.currentAnswer = null;
        }

        function handleComplete() {
            if (state.processing) return;
            state.processing = true;

            const color = SPECIES_DATA[state.active].color;
            
            // Simultaneous Burst and Flip
            createConfetti(color, state.active);
            
            state.inventory[state.active]++;
            state.indices[state.active]++;
            
            if (state.active === 'fig' || state.active === 'olive') {
                state.rosterIdx = (state.rosterIdx + parseInt(state.cfg.groupSize)) % state.roster.length;
            }

            updateThermometer();
            renderNav();
            stopTimer();

            // Card resets immediately as confetti is flying
            setTimeout(() => {
                syncCard();
                checkGameOver();
            }, 600);
        }

        // --- Match Logic ---
        function renderMatchGrid() {
            const grid = document.getElementById('match-grid');
            const s = SPECIES_DATA.pomegranate;
            
            if (!state.pomegranate.deck) {
                const deck = [];
                s.items.forEach((p, i) => {
                    deck.push({ id: `a-${i}`, text: p.a, mid: i });
                    deck.push({ id: `b-${i}`, text: p.b, mid: i });
                });
                state.pomegranate.deck = deck.sort(() => 0.5 - Math.random());
            }

            grid.innerHTML = state.pomegranate.deck.map((card, i) => {
                const matched = state.pomegranate.matched.includes(card.mid);
                const flipped = state.pomegranate.flipped.includes(i) || matched;
                const mColor = matched ? getMatchColor(card.mid) : '';
                
                return `
                <button onclick="clickMatch(${i})" 
                    class="relative aspect-[3/4] rounded-xl border-4 transition-all flex flex-col items-center justify-center p-2 
                    ${flipped ? 'bg-white text-slate-900 border-white' : 'bg-red-700 border-red-800 text-white/20'}"
                    style="${matched ? `border-color: ${mColor};` : ''}">
                    
                    ${!flipped ? `<span class="text-3xl font-black">${i+1}</span>` : ''}
                    
                    <span class="${flipped ? 'opacity-100' : 'opacity-0'} font-bold text-[11px] leading-tight hebrew text-center z-10">${card.text}</span>
                </button>
                `;
            }).join('');
        }

        function clickMatch(idx) {
            const p = state.pomegranate;
            if (p.flipped.length === 2 || p.flipped.includes(idx) || p.matched.includes(p.deck[idx].mid)) return;

            p.flipped.push(idx);
            renderMatchGrid();

            if (p.flipped.length === 2) {
                if (p.deck[p.flipped[0]].mid === p.deck[p.flipped[1]].mid) {
                    p.matched.push(p.deck[p.flipped[0]].mid);
                    p.flipped = [];
                    state.inventory.pomegranate = Math.floor((p.matched.length / 8) * state.cfg.target);
                    updateThermometer();
                    renderNav();
                    if (p.matched.length === 8) {
                        createConfetti('#dc2626', 'pomegranate');
                        setTimeout(checkGameOver, 1000);
                    } else {
                        renderMatchGrid();
                    }
                } else {
                    setTimeout(() => { p.flipped = []; renderMatchGrid(); }, 1200);
                }
            }
        }

        // --- Visual Helpers ---
        function getIcon(key, color, size = "w-full h-full", border = 2) {
            const paths = {
                wheat: `<path d="M12 22V12M12 12L8 8M12 12L16 8M12 8V2M12 8L8 4M12 8L16 4" stroke="${color}" stroke-width="${border}"/>`,
                barley: `<path d="M12 22V10M12 10C12 10 16 8 16 5M12 10C12 10 8 8 8 5" stroke="${color}" stroke-width="${border}"/>`,
                grape: `<circle cx="12" cy="7" r="2.5" stroke="${color}" stroke-width="${border}"/><circle cx="9.5" cy="11" r="2.5" stroke="${color}" stroke-width="${border}"/><circle cx="14.5" cy="11" r="2.5" stroke="${color}" stroke-width="${border}"/><circle cx="12" cy="15" r="2.5" stroke="${color}" stroke-width="${border}"/>`,
                fig: `<path d="M12 22C12 22 19 18 19 13C19 8 12 3 12 3C12 3 5 8 5 13C5 18 12 22 12 22Z" stroke="${color}" stroke-width="${border}"/>`,
                pomegranate: `<circle cx="12" cy="13" r="8" stroke="${color}" stroke-width="${border}"/><path d="M9 5L8 2M12 5V2M15 5L16 2" stroke="${color}" stroke-width="${border}"/>`,
                olive: `<ellipse cx="12" cy="13" rx="5" ry="7" stroke="${color}" stroke-width="${border}"/><circle cx="12" cy="11" r="1.5" fill="${color}"/>`,
                date: `<path d="M12 22V5M12 5C12 5 18 7 21 12M12 5C12 5 6 7 3 12" stroke="${color}" stroke-width="${border}"/>`
            };
            return `<svg viewBox="0 0 24 24" fill="none" class="${size}">${paths[key] || ''}</svg>`;
        }

        function createConfetti(color, key) {
            const o = document.getElementById('particle-overlay');
            for(let i=0; i<60; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDelay = Math.random() * 0.4 + 's';
                const size = Math.random() * 20 + 20;
                p.innerHTML = getIcon(key, color, `w-[${size}px] h-[${size}px]`, 3);
                o.appendChild(p);
                setTimeout(() => p.remove(), 2500);
            }
        }

        function renderContent(type, html) {
            document.getElementById('back-content').innerHTML = `
                <span class="text-[9px] font-black text-slate-400 uppercase mb-4 tracking-[0.4em]">${type} Mission</span>
                ${html}
            `;
        }

        function updateThermometer() {
            const keys = Object.keys(SPECIES_DATA);
            const totalTarget = state.cfg.target * keys.length;
            const currentTotal = Object.values(state.inventory).reduce((a, b) => a + b, 0);
            const percent = Math.min(100, Math.round((currentTotal / totalTarget) * 100));
            
            document.getElementById('global-percent').innerText = percent + '%';
            document.getElementById('progress-fill').style.height = percent + '%';

            const badgeContainer = document.getElementById('species-badges');
            badgeContainer.innerHTML = keys.map(k => {
                const s = SPECIES_DATA[k];
                const isDone = state.inventory[k] >= state.cfg.target;
                return `
                <div class="species-badge w-12 h-12 rounded-xl flex items-center justify-center p-2 border border-white/10 ${isDone ? 'completed shadow-lg' : ''}" 
                     style="background: ${isDone ? s.color : 'transparent'};">
                    ${getIcon(k, isDone ? 'white' : 'rgba(255,255,255,0.2)', 'w-full h-full', isDone ? 2.5 : 2)}
                </div>
                `;
            }).join('');
        }

        function selectSpecies(k) { state.active = k; syncCard(); renderNav(); }
        function toggleSettings() { document.getElementById('settings-modal').classList.toggle('hidden'); }
        function renderRoster() {
            const list = document.getElementById('roster-list');
            list.innerHTML = state.roster.map((s, i) => `<div class="flex justify-between p-1 px-3 bg-white/5 rounded text-sm"><span>${s}</span><button onclick="removeStudent(${i})">✕</button></div>`).join('');
        }
        function addStudent() { const input = document.getElementById('add-student-name'); if(input.value) { state.roster.push(input.value); input.value=''; renderRoster(); } }
        function removeStudent(i) { state.roster.splice(i,1); renderRoster(); }

        function startTimer() {
            const ui = document.getElementById('timer-ui');
            const val = document.getElementById('timer-val');
            let remaining = parseInt(state.cfg.timer);
            ui.classList.remove('hidden');
            val.innerText = remaining + 's';
            clearInterval(state.timer);
            state.timer = setInterval(() => {
                remaining--;
                val.innerText = remaining + 's';
                if(remaining <= 0) stopTimer();
            }, 1000);
        }
        function stopTimer() { clearInterval(state.timer); document.getElementById('timer-ui').classList.add('hidden'); }
        function getMatchColor(i) { return ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316', '#a855f7'][i % 8]; }
        function checkGameOver() { if(Object.values(state.inventory).every(v => v >= state.cfg.target)) document.getElementById('game-over-overlay').classList.remove('hidden'); }
        function closeCelebration() { document.getElementById('game-over-overlay').classList.add('hidden'); }
        
        function resetGame() {
            state.inventory = { wheat:0, barley:0, grape:0, fig:0, pomegranate:0, olive:0, date:0 };
            state.pomegranate = { matched: [], flipped: [], deck: null };
            state.rosterIdx = 0;
            state.cfg.target = document.getElementById('cfg-target-missions').value;
            state.cfg.groupSize = document.getElementById('cfg-group-size').value;
            state.cfg.timer = document.getElementById('cfg-timer').value;
            init();
            toggleSettings();
        }

        window.onload = init;
    </script>
</body>
</html>

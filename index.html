<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Bishvat: The Seven Species Mission</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020617; color: white; margin: 0; overflow: hidden; height: 100vh; }
        .hebrew-text { direction: rtl; unicode-bidi: isolate; font-family: 'Arial', sans-serif; }
        .perspective-2000 { perspective: 2000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .no-select { user-select: none; }
        .card-container { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const MATCH_PAIRS = [
            { h: "אֶרֶץ", e: "Land", hex: "#38bdf8" }, { h: "מַיִם", e: "Water", hex: "#60a5fa" }, 
            { h: "שֶׁמֶשׁ", e: "Sun", hex: "#facc15" }, { h: "פְּרִי", e: "Fruit", hex: "#f87171" },
            { h: "טֶבַע", e: "Nature", hex: "#34d399" }, { h: "עֵץ", e: "Tree", hex: "#d97706" }, 
            { h: "בְּרָכָה", e: "Blessing", hex: "#818cf8" }, { h: "חַיִּים", e: "Life", hex: "#fb7185" }
        ];

        const GRAPE_MISSIONS = [
            { quote: "Unless someone like you cares a whole awful lot...", source: "The Lorax", prompt: "What local environment part would you stand up for first?", type: "Discussion", fact: "One vine can produce up to 40 clusters of grapes!" },
            { quote: "As my ancestors planted for me, so I plant for my children.", source: "Talmud", prompt: "What are we 'planting' for people 50 years from now?", type: "Discussion" },
            { quote: "Earth provides enough to satisfy every man's needs, but not every man's greed.", source: "Gandhi", prompt: "How can we practice 'enough-ness' this week?", type: "Discussion" },
            { quote: "The best time to plant a tree was 20 years ago. The second best time is now.", source: "Proverb", prompt: "What is a green habit you can start today?", type: "Discussion" },
            { quote: "A vine needs a trellis to grow high.", source: "Folklore", prompt: "Who are the 'trellises' (supporters) in your life?", type: "Discussion" },
            { quote: "Look deep into nature, then you will understand everything better.", source: "Einstein", prompt: "What is the most complex thing you've seen in nature?", type: "Discussion" },
            { quote: "To walk in nature is to witness a thousand miracles.", source: "Mary Davis", prompt: "Name one 'tiny miracle' you saw outside today?", type: "Discussion" },
            { quote: "The vine produces clusters, not single grapes.", source: "Proverb", prompt: "How is our class like a cluster of grapes?", type: "Discussion" },
            { quote: "Don't destroy the fruit-bearing trees.", source: "Torah", prompt: "Why is it important not to waste resources (Bal Tashchit)?", type: "Discussion" },
            { quote: "Every blade of grass has an angel whispering 'Grow'.", source: "Midrash", prompt: "What whispers 'grow' to you when things are hard?", type: "Discussion" }
        ];

        const SPECIES_DATA = {
            wheat: { en: "Wheat", he: "חִטָּה", hex: "#f59e0b", bg: "bg-amber-500", border: "border-amber-500" },
            barley: { en: "Barley", he: "שְׂעוֹרָה", hex: "#eab308", bg: "bg-yellow-400", border: "border-yellow-400" },
            grape: { en: "Grapes", he: "עֲנָבִים", hex: "#6366f1", bg: "bg-indigo-500", border: "border-indigo-500" },
            fig: { en: "Figs", he: "תְּאֵנִים", hex: "#9333ea", bg: "bg-purple-600", border: "border-purple-600" },
            pomegranate: { en: "Pomegranate", he: "רִמּוֹן", hex: "#dc2626", bg: "bg-red-600", border: "border-red-600" },
            olive: { en: "Olives", he: "זֵיתִים", hex: "#65a30d", bg: "bg-lime-600", border: "border-lime-600" },
            date: { en: "Dates", he: "תְּמָרִים", hex: "#c2410c", bg: "bg-orange-700", border: "border-orange-700" }
        };

        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                const checkLucide = setInterval(() => {
                    if (window.lucide) {
                        const icon = window.lucide.icons[name];
                        if (icon) {
                            const s = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${icon[1].map(i => `<${i[0]} ${Object.entries(i[1]).map(([k,v]) => `${k}="${v}"`).join(' ')} />`).join('')}</svg>`;
                            setSvg(s); clearInterval(checkLucide);
                        }
                    }
                }, 50);
                return () => clearInterval(checkLucide);
            }, [name, size]);
            return <span className={className} dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        const SpeciesIcon = ({ type, className = "", color = "currentColor", fill = "none" }) => {
            const icons = {
                wheat: <path d="M12 22V12M12 12L8 8M12 12L16 8M12 8V2M12 8L8 4" />,
                barley: <path d="M12 22V10M12 10C12 10 16 8 16 5M12 10C12 10 8 8 8 5" />,
                grape: <g><circle cx="12" cy="7" r="2.5"/><circle cx="9.5" cy="11" r="2.5"/><circle cx="14.5" cy="11" r="2.5"/><circle cx="12" cy="15" r="2.5"/></g>,
                fig: <path d="M12 22C12 22 19 18 19 13C19 8 12 3 12 3C12 3 5 8 5 13C5 18 12 22 12 22Z" />,
                pomegranate: <g><path d="M12 21C16.5 21 20 17.5 20 13C20 8.5 16 5 12 5C8 5 4 8.5 4 13C4 17.5 7.5 21 12 21Z"/><path d="M9 5L8 2M12 5V2M15 5L16 2"/></g>,
                olive: <ellipse cx="12" cy="13" rx="5" ry="7" />,
                date: <path d="M12 22V5M12 5C12 5 18 7 21 12M12 5C12 5 6 7 3 12" />
            };
            return <svg viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2.5" strokeLinecap="round" className={className}>{icons[type]}</svg>;
        };

        const ProgressRing = ({ progress, color, size = 48 }) => {
            const radius = 20;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (progress / 100) * circumference;
            return (
                <svg width={size} height={size} className="transform -rotate-90">
                    <circle cx={size/2} cy={size/2} r={radius} stroke="currentColor" strokeWidth="4" fill="transparent" className="opacity-10" />
                    <circle cx={size/2} cy={size/2} r={radius} stroke={color} strokeWidth="4" fill="transparent" strokeDasharray={circumference} style={{ strokeDashoffset: offset, transition: 'stroke-dashoffset 0.8s ease' }} strokeLinecap="round" />
                </svg>
            );
        };

        const App = () => {
            const [roster, setRoster] = useState(["Alex", "Marshall", "Kai", "Adi", "Aaron", "David", "Brenner"]);
            const [inventory, setInventory] = useState({});
            const [activeSpecies, setActiveSpecies] = useState('wheat');
            const [cardState, setCardState] = useState('back');
            const [challenge, setChallenge] = useState(null);
            const [selectedAgents, setSelectedAgents] = useState([]);
            const [showSettings, setShowSettings] = useState(false);
            const [targetPerSpecies, setTargetPerSpecies] = useState(3);
            const [groupSize, setGroupSize] = useState(2);
            
            const [memoryCards, setMemoryCards] = useState([]);
            const [flippedIndices, setFlippedIndices] = useState([]);
            const [matchedIds, setMatchedIds] = useState([]);

            const initMemoryGame = useCallback(() => {
                const cards = [];
                MATCH_PAIRS.forEach((pair, i) => {
                    cards.push({ id: `h-${i}`, text: pair.h, matchId: i, type: 'he', color: pair.hex });
                    cards.push({ id: `e-${i}`, text: pair.e, matchId: i, type: 'en', color: pair.hex });
                });
                setMemoryCards(cards.sort(() => Math.random() - 0.5));
                setFlippedIndices([]);
                setMatchedIds([]);
            }, []);

            useEffect(() => { initMemoryGame(); }, [initMemoryGame]);

            const generateMission = useCallback(() => {
                if (activeSpecies === 'pomegranate') return;
                
                let next;
                if (activeSpecies === 'grape') {
                    next = GRAPE_MISSIONS[Math.floor(Math.random() * GRAPE_MISSIONS.length)];
                } else {
                    const deck = [
                        { id: "w1", prompt: "אִילָן", answer: "אִילָן (Tree)", type: "Vocab", hasAnswer: true },
                        { id: "b1", prompt: "How many 'New Years' are in the Jewish calendar?", answer: "Four", type: "Trivia", hasAnswer: true },
                        { id: "d1", prompt: "The act of 'Repairing the World' through justice and kindness.", answer: "Tikkun Olam", type: "Jeopardy", hasAnswer: true }
                    ];
                    next = deck[Math.floor(Math.random() * deck.length)];
                }
                
                setChallenge(next);
                
                // Only select agents for Fig and Olive
                if (activeSpecies === 'fig' || activeSpecies === 'olive') {
                    const pool = [...roster].sort(() => 0.5 - Math.random());
                    setSelectedAgents(pool.slice(0, groupSize));
                } else {
                    setSelectedAgents([]);
                }
            }, [activeSpecies, roster, groupSize]);

            useEffect(() => { generateMission(); }, [activeSpecies, generateMission]);

            const handleFlip = (idx) => {
                if (flippedIndices.length === 2 || flippedIndices.includes(idx) || matchedIds.includes(memoryCards[idx].matchId)) return;
                const newFlipped = [...flippedIndices, idx];
                setFlippedIndices(newFlipped);

                if (newFlipped.length === 2) {
                    const [first, second] = newFlipped;
                    if (memoryCards[first].matchId === memoryCards[second].matchId) {
                        setMatchedIds(prev => [...prev, memoryCards[first].matchId]);
                        setFlippedIndices([]);
                        if (matchedIds.length + 1 === MATCH_PAIRS.length) {
                            setTimeout(() => {
                                setInventory(prev => ({ ...prev, pomegranate: (prev.pomegranate || 0) + 1 }));
                                initMemoryGame();
                            }, 1500);
                        }
                    } else {
                        setTimeout(() => setFlippedIndices([]), 1000);
                    }
                }
            };

            const completeMission = () => {
                setInventory(prev => ({ ...prev, [activeSpecies]: (prev[activeSpecies] || 0) + 1 }));
                setCardState('back');
                setTimeout(generateMission, 500);
            };

            const tikkunProgress = (Object.keys(SPECIES_DATA).filter(k => (inventory[k] || 0) >= targetPerSpecies).length / 7) * 100;

            return (
                <div className="h-screen flex flex-col bg-slate-950 text-white overflow-hidden no-select">
                    <header className="h-20 bg-slate-900/80 border-b border-white/10 px-8 flex items-center justify-between shrink-0 z-[60]">
                        <div className="flex items-center gap-6">
                            <div className="p-2.5 bg-emerald-500 rounded-xl shadow-lg shadow-emerald-500/20">
                                <SpeciesIcon type="date" className="w-7 h-7 text-white" />
                            </div>
                            <div>
                                <h1 className="text-xl font-black uppercase tracking-tighter leading-none">The Seven Species Mission</h1>
                                <span className="text-[10px] font-black text-emerald-400 uppercase tracking-widest mt-1 block">Planting Seeds for Tomorrow</span>
                            </div>
                        </div>
                        <button onClick={() => setShowSettings(true)} className="p-3 hover:bg-white/10 rounded-full transition-colors">
                            <LucideIcon name="settings-2" />
                        </button>
                    </header>

                    <main className="flex-grow flex p-6 gap-6 overflow-hidden">
                        <div className="w-72 flex flex-col gap-2 shrink-0 hide-scrollbar overflow-y-auto">
                            {Object.entries(SPECIES_DATA).map(([key, data]) => {
                                const count = inventory[key] || 0;
                                const isDone = count >= targetPerSpecies;
                                const isActive = activeSpecies === key;
                                const progress = Math.min((count / targetPerSpecies) * 100, 100);

                                return (
                                    <button key={key} onClick={() => {setActiveSpecies(key); setCardState('back');}}
                                        className={`py-6 px-5 rounded-2xl border-2 transition-all flex items-center gap-4 relative overflow-hidden group
                                            ${isDone ? data.bg + ' border-transparent' : isActive ? 'bg-white border-white text-slate-950 shadow-xl' : 'bg-slate-900/60 border-white/5 opacity-70 hover:opacity-100'}`}>
                                        <div className="relative shrink-0">
                                            <div className="absolute inset-0 flex items-center justify-center">
                                                <ProgressRing progress={progress} color={isDone ? '#fff' : data.hex} size={44} />
                                            </div>
                                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center relative z-10 transition-colors ${isActive ? 'bg-slate-100' : isDone ? 'bg-white/20' : 'bg-white/5'}`}>
                                                <SpeciesIcon type={key} className="w-6 h-6" color={isActive ? data.hex : 'white'} />
                                            </div>
                                        </div>
                                        <div className="text-left flex-grow min-w-0 z-10">
                                            <div className={`text-[10px] font-black uppercase tracking-widest mb-1 truncate ${isActive ? 'text-slate-500' : isDone ? 'text-white/80' : 'text-slate-400'}`}>{data.en}</div>
                                            <div className={`text-xl font-black hebrew-text truncate ${isDone ? 'text-white' : ''}`}>{data.he}</div>
                                        </div>
                                        {isDone && <LucideIcon name="check-circle" size={18} className="text-white shrink-0 z-10" />}
                                    </button>
                                );
                            })}
                        </div>

                        <div className="flex-grow flex flex-col items-center justify-center relative min-h-0">
                            {cardState !== 'back' && activeSpecies !== 'pomegranate' && (
                                <div className="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-10 transition-opacity" />
                            )}

                            {activeSpecies === 'pomegranate' ? (
                                <div className="w-full h-full max-h-[85vh] grid grid-cols-4 grid-rows-4 gap-4 p-4">
                                    {memoryCards.map((card, idx) => {
                                        const isFlipped = flippedIndices.includes(idx) || matchedIds.includes(card.matchId);
                                        const isMatched = matchedIds.includes(card.matchId);
                                        return (
                                            <div key={card.id} onClick={() => handleFlip(idx)} className="perspective-2000 cursor-pointer w-full h-full min-h-0">
                                                <div className={`relative w-full h-full card-container transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                                                    <div className="absolute inset-0 backface-hidden bg-red-600 rounded-2xl flex items-center justify-center border-4 border-white/20 shadow-lg">
                                                        <span className="text-3xl font-black text-white/40">{idx + 1}</span>
                                                    </div>
                                                    <div className={`absolute inset-0 rotate-y-180 backface-hidden bg-white rounded-2xl border-4 flex flex-col items-center justify-center p-2 text-center shadow-xl transition-colors duration-500`}
                                                        style={{ borderColor: isMatched ? card.color : '#e2e8f0' }}>
                                                        <span className={`text-2xl font-black text-black leading-tight ${card.type === 'he' ? 'hebrew-text' : ''}`}>
                                                            {card.text}
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="flex flex-col items-center w-full h-full justify-center gap-10 z-20">
                                    {selectedAgents.length > 0 && (
                                        <div className="flex gap-4 animate-in slide-in-from-top-4">
                                            {selectedAgents.map(a => (
                                                <div key={a} className="px-6 py-3 bg-white text-slate-950 rounded-2xl border-[3px] border-emerald-500 shadow-xl font-black uppercase text-lg flex items-center gap-3">
                                                    <div className="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-xs text-white">{a[0]}</div>
                                                    {a}
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="w-full max-w-xl aspect-[3/4] perspective-2000">
                                        <div className={`w-full h-full transform-style-3d transition-all duration-700 ${cardState !== 'back' ? 'rotate-y-180' : ''}`}>
                                            <div className="absolute inset-0 backface-hidden bg-white rounded-[3rem] p-4 shadow-2xl">
                                                <div className={`w-full h-full ${SPECIES_DATA[activeSpecies].bg} rounded-[2.5rem] flex flex-col items-center justify-center text-white relative overflow-hidden`}>
                                                    <div className="absolute inset-0 opacity-10 pointer-events-none">
                                                        <SpeciesIcon type={activeSpecies} className="w-full h-full scale-125" color="white" fill="white" />
                                                    </div>
                                                    <h2 className="text-7xl font-black uppercase tracking-tighter mb-4 z-10">{SPECIES_DATA[activeSpecies].en}</h2>
                                                    <button onClick={() => setCardState('front')} className="mt-8 px-14 py-6 bg-white text-slate-950 rounded-2xl font-black text-2xl uppercase tracking-widest shadow-2xl hover:scale-105 active:scale-95 transition-all z-10">Start Mission</button>
                                                </div>
                                            </div>

                                            <div className="absolute inset-0 rotate-y-180 backface-hidden bg-white rounded-[3rem] p-12 flex flex-col shadow-2xl border-[16px] border-slate-50">
                                                <div className="flex-grow flex flex-col items-center justify-center text-center">
                                                    {activeSpecies === 'grape' && challenge?.quote && (
                                                        <div className="mb-6 animate-in fade-in slide-in-from-bottom-2">
                                                            <div className="text-2xl font-serif italic text-slate-600 mb-2 leading-relaxed">"{challenge.quote}"</div>
                                                            <div className="text-xs font-black uppercase tracking-widest text-emerald-600">— {challenge.source}</div>
                                                        </div>
                                                    )}
                                                    <div className={`font-black text-slate-900 leading-tight mb-8 ${challenge?.prompt?.length > 40 ? 'text-3xl' : 'text-5xl'}`}>
                                                        {challenge?.prompt}
                                                    </div>
                                                    {cardState === 'reveal' && challenge?.hasAnswer && (
                                                        <div className="p-6 bg-emerald-50 rounded-2xl border-4 border-emerald-100 animate-in zoom-in w-full text-3xl font-black text-emerald-600 uppercase">
                                                            {challenge.answer}
                                                        </div>
                                                    )}
                                                </div>
                                                <button onClick={challenge?.hasAnswer && cardState === 'front' ? () => setCardState('reveal') : completeMission} 
                                                    className={`w-full py-6 ${SPECIES_DATA[activeSpecies].bg} text-white rounded-2xl font-black text-xl uppercase tracking-widest shadow-xl active:scale-95 transition-all`}>
                                                    {challenge?.hasAnswer && cardState === 'front' ? 'Reveal Answer' : 'Mission Success'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="w-24 flex flex-col items-center shrink-0 h-full">
                            <span className="text-2xl font-black text-emerald-400 mb-2">{Math.round(tikkunProgress)}</span>
                            <div className="flex-grow w-16 bg-slate-900/40 rounded-full border border-white/10 flex flex-col-reverse p-2 relative overflow-hidden shadow-inner">
                                <div className="absolute bottom-0 inset-x-0 bg-emerald-500/30 transition-all duration-1000 ease-out" style={{ height: `${tikkunProgress}%` }} />
                                <div className="z-10 flex flex-col-reverse gap-3">
                                    {Object.keys(SPECIES_DATA).map(k => (inventory[k] || 0) >= targetPerSpecies && (
                                        <div key={k} className={`w-full aspect-square rounded-full flex items-center justify-center ${SPECIES_DATA[k].bg} border-4 border-slate-950 shadow-xl animate-in zoom-in duration-500`}>
                                            <SpeciesIcon type={k} className="w-8 h-8 text-white" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    {showSettings && (
                        <div className="fixed inset-0 bg-slate-950/95 z-[100] flex items-center justify-center p-6 backdrop-blur-md">
                            <div className="bg-slate-900 w-full max-w-2xl rounded-[3rem] border border-white/10 p-10 shadow-2xl overflow-y-auto max-h-[90vh]">
                                <div className="flex justify-between items-center mb-10">
                                    <h2 className="text-4xl font-black uppercase italic tracking-tighter">Mission Config</h2>
                                    <button onClick={() => setShowSettings(false)} className="p-2 hover:bg-white/10 rounded-full"><LucideIcon name="x" size={32} /></button>
                                </div>

                                <div className="grid grid-cols-2 gap-10">
                                    <div className="space-y-8">
                                        <section>
                                            <label className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 mb-4 block">Missions Per Species</label>
                                            <div className="flex gap-2">
                                                {[1, 3, 5, 10].map(val => (
                                                    <button key={val} onClick={() => setTargetPerSpecies(val)}
                                                        className={`flex-grow py-4 rounded-xl font-black text-xl transition-all ${targetPerSpecies === val ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                                                        {val}
                                                    </button>
                                                ))}
                                            </div>
                                        </section>
                                        <section>
                                            <label className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 mb-4 block">Team Size (Fig/Olive)</label>
                                            <div className="flex gap-2">
                                                {[1, 2, 3, 4].map(val => (
                                                    <button key={val} onClick={() => setGroupSize(val)}
                                                        className={`flex-grow py-4 rounded-xl font-black text-xl transition-all ${groupSize === val ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/30' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                                                        {val}
                                                    </button>
                                                ))}
                                            </div>
                                        </section>
                                    </div>

                                    <section>
                                        <label className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 mb-4 block">Field Agents ({roster.length})</label>
                                        <div className="bg-slate-950/50 rounded-2xl p-4 border border-white/5 max-h-64 overflow-y-auto hide-scrollbar mb-4 space-y-2">
                                            {roster.map((name, i) => (
                                                <div key={i} className="bg-slate-800/80 px-4 py-3 rounded-xl flex items-center justify-between group">
                                                    <span className="font-bold tracking-tight">{name}</span>
                                                    <button onClick={() => setRoster(roster.filter((_, idx) => idx !== i))} className="p-2 text-red-400 hover:bg-red-400/10 rounded-lg transition-all" title="Remove Agent">
                                                        <LucideIcon name="trash-2" size={18} />
                                                    </button>
                                                </div>
                                            ))}
                                            {roster.length === 0 && <div className="text-center py-8 text-slate-600 italic">No agents recruited...</div>}
                                        </div>
                                        <form className="flex gap-2" onSubmit={(e) => {
                                            e.preventDefault();
                                            const name = e.target.agentName.value.trim();
                                            if (name) {
                                                setRoster([...roster, name]);
                                                e.target.reset();
                                            }
                                        }}>
                                            <input name="agentName" placeholder="New Agent Name..." className="flex-grow bg-slate-950 border border-white/10 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 transition-colors" />
                                            <button className="bg-emerald-500 px-6 rounded-xl font-black uppercase tracking-widest text-xs">Add</button>
                                        </form>
                                    </section>
                                </div>
                                <button onClick={() => setShowSettings(false)} className="w-full mt-12 py-5 bg-white text-slate-950 rounded-2xl font-black uppercase tracking-widest text-xl hover:bg-slate-100 transition-colors shadow-2xl">Save & Resume Missions</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</body>
</html>
